<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0E10">
<meta name="apple-mobile-web-app-title" content="Corner Weights">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>TFTR Corner Weights</title>
<style>
  :root{
    --bg:#0C0E10; --panel:#16191D; --panel2:#1C2025; --line:#2A2F35;
    --text:#EDEFF2; --muted:#8A9099; --amber:#FFB020; --green:#54BF66; --red:#FF5C5C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,system-ui,sans-serif;}
  body{padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom)) 14px;
    max-width:520px; margin:0 auto;}
  .num{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums;}

  header{padding:18px 2px 14px 2px; display:flex; align-items:flex-end; justify-content:space-between;}
  #logo{display:block; width:150px; height:auto; margin-bottom:6px;}
  .eyebrow{font-size:11px; letter-spacing:2.5px; color:var(--muted); text-transform:uppercase;}
  h1{font-size:22px; margin:2px 0 0 0; letter-spacing:.5px;}

  /* Job name field */
  #jobName{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    color:var(--text); font-family:inherit; font-size:19px; font-weight:600;
    padding:0 14px; outline:none; min-height:56px; margin-bottom:14px;}
  #jobName:focus{border-color:var(--amber);}
  #jobName::placeholder{color:var(--muted); font-weight:400;}

  /* Percentage mode selector */
  .seg-label{font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin:0 4px 6px 4px;}

  /* Car layout */
  .car{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .cross-row{grid-column:1 / -1; display:flex; justify-content:center; padding:2px 0;}
  .corner{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 12px 10px 12px; cursor:pointer;}
  .corner.sel{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber);}
  .corner.sel label{color:var(--amber);}
  .corner label{display:block; font-size:12px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
  .corner input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    color:var(--amber); font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums;
    font-size:34px; font-weight:600; letter-spacing:-1px; text-align:right; padding:8px 10px; outline:none; min-height:56px;}
  .corner input:focus{border-color:var(--amber);}
  .corner .pct{margin-top:6px; font-size:14px; color:var(--muted); text-align:right; min-height:18px;}
  .cross-badge{background:var(--bg); border:2px solid var(--line); border-radius:16px;
    padding:8px 14px; text-align:center; min-width:150px;}
  .cross-badge .cb-label{font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase;}
  .cross-badge .cb-val{font-size:26px; font-weight:700; color:var(--amber);}
  .cross-badge .cb-sub{font-size:13px; color:var(--muted);}
  .cross-badge.good .cb-val{color:var(--green);}
  .cross-badge.bad .cb-val{color:var(--red);}

  /* Results */
  .results{margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .total-row{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .total-row .t-label{font-size:12px; letter-spacing:2px; color:var(--muted); text-transform:uppercase;}
  .total-row .t-val{font-size:40px; font-weight:700; color:var(--text);}
  .total-row .t-val small{font-size:16px; color:var(--muted); font-weight:400;}
  .split{margin-top:14px;}
  .split .s-head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .split .s-head .name{color:var(--muted); letter-spacing:1px; text-transform:uppercase; font-size:11px;}
  .split .s-head .vals{color:var(--text); font-weight:600;}
  .bar{height:14px; border-radius:7px; background:var(--panel2); overflow:hidden; display:flex; border:1px solid var(--line);}
  .bar .fill{background:var(--amber); height:100%; transition:width .2s;}
  .diag{margin-top:14px; display:flex; justify-content:space-between; font-size:14px; color:var(--muted);}
  .diag b{color:var(--text);}

  /* Balance advice */
  .balance{margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .balance .b-head{font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  .b-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .b-cell{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:8px 10px;}
  .b-cell .b-top{display:flex; justify-content:space-between; align-items:baseline;}
  .b-cell .b-c{font-size:11px; letter-spacing:1px; color:var(--muted);}
  .b-cell .b-d{font-size:18px; font-weight:700; color:var(--amber);}
  .b-cell .b-d.ok{color:var(--green);}
  .b-cell .b-tgt{font-size:12px; color:var(--muted); text-align:right; margin-top:2px; min-height:15px;}
  .b-note{margin-top:10px; font-size:14px; color:var(--text); line-height:1.45;}
  .b-note.good{color:var(--green); font-weight:600;}

  /* Saved-setups search */
  #setupSearch{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-family:inherit; font-size:16px; padding:0 12px; outline:none;
    min-height:48px; margin-bottom:10px; -webkit-appearance:none;}
  #setupSearch:focus{border-color:var(--amber);}
  #setupSearch::placeholder{color:var(--muted);}

  /* Buttons */
  .btnrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px;}
  button{min-height:56px; border-radius:14px; border:1px solid var(--line); background:var(--panel);
    color:var(--text); font-size:16px; font-weight:600; font-family:inherit;}
  button:active{background:var(--panel2);}
  button.primary{background:var(--amber); color:#181203; border-color:var(--amber);}
  button.danger{color:var(--red);}

  /* Saved setups */
  .saved{margin-top:16px; display:none;}
  .saved.open{display:block;}
  .saved h2{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 8px 4px;}
  .setup-item{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
    display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .setup-item .info{flex:1; min-width:0;}
  .setup-item .name{font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .setup-item .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .setup-item button{min-height:44px; padding:0 14px; font-size:14px;}
  .empty{color:var(--muted); font-size:14px; padding:8px 4px;}

  #toast{position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:10px 18px;
    border-radius:12px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
  #toast.show{opacity:1;}
  .storage-warn{display:none; margin-top:10px; font-size:13px; color:var(--red);}
</style>
</head>
<body>

<label class="seg-label" for="jobName">Job / Setup name</label>
<input id="jobName" type="text" placeholder="e.g. Anglesey full tank" autocomplete="off">

<div class="seg-label">Tap two corners to pair them</div>

<div class="car">
  <div class="corner" data-c="lf">
    <label for="lf">LF · Left Front</label>
    <input id="lf" type="text" inputmode="decimal" maxlength="5" placeholder="0" autocomplete="off">
    <div class="pct" id="lfPct">—</div>
  </div>
  <div class="corner" data-c="rf">
    <label for="rf">RF · Right Front</label>
    <input id="rf" type="text" inputmode="decimal" maxlength="5" placeholder="0" autocomplete="off">
    <div class="pct" id="rfPct">—</div>
  </div>
  <div class="cross-row">
    <div class="cross-badge" id="crossBadge">
      <div class="cb-label" id="pairLabel">RF + LR · Cross</div>
      <div class="cb-val num" id="crossVal">—</div>
      <div class="cb-sub num" id="pairKg">—</div>
    </div>
  </div>
  <div class="corner" data-c="lr">
    <label for="lr">LR · Left Rear</label>
    <input id="lr" type="text" inputmode="decimal" maxlength="5" placeholder="0" autocomplete="off">
    <div class="pct" id="lrPct">—</div>
  </div>
  <div class="corner" data-c="rr">
    <label for="rr">RR · Right Rear</label>
    <input id="rr" type="text" inputmode="decimal" maxlength="5" placeholder="0" autocomplete="off">
    <div class="pct" id="rrPct">—</div>
  </div>
</div>

<div class="results">
  <div class="total-row">
    <span class="t-label">Total</span>
    <span class="t-val num" id="totalVal">— <small>kg</small></span>
  </div>
  <div class="split">
    <div class="s-head"><span class="name">Front / Rear</span><span class="vals num" id="frVals">—</span></div>
    <div class="bar"><div class="fill" id="frBar" style="width:50%"></div></div>
  </div>
  <div class="split">
    <div class="s-head"><span class="name">Left / Right</span><span class="vals num" id="lrVals">—</span></div>
    <div class="bar"><div class="fill" id="lrBar" style="width:50%"></div></div>
  </div>
  <div class="diag">
    <span>RF+LR <b class="num" id="diag1">—</b></span>
    <span>LF+RR <b class="num" id="diag2">—</b></span>
  </div>
  <div class="balance">
    <div class="b-head">Balance · change needed per corner</div>
    <div class="b-grid">
      <div class="b-cell"><div class="b-top"><span class="b-c">LF</span><span class="b-d num" id="balLf">—</span></div><div class="b-tgt num" id="tgtLf"></div></div>
      <div class="b-cell"><div class="b-top"><span class="b-c">RF</span><span class="b-d num" id="balRf">—</span></div><div class="b-tgt num" id="tgtRf"></div></div>
      <div class="b-cell"><div class="b-top"><span class="b-c">LR</span><span class="b-d num" id="balLr">—</span></div><div class="b-tgt num" id="tgtLr"></div></div>
      <div class="b-cell"><div class="b-top"><span class="b-c">RR</span><span class="b-d num" id="balRr">—</span></div><div class="b-tgt num" id="tgtRr"></div></div>
    </div>
    <div class="b-note" id="balNote"></div>
  </div>
</div>

<div class="btnrow">
  <button class="primary" id="saveBtn">Save</button>
  <button id="loadBtn">Load</button>
  <button class="danger" id="clearBtn">Clear</button>
</div>

<div class="storage-warn" id="storageWarn">Saving isn't available in this viewer — setups will be lost when you close the page.</div>

<div class="saved" id="savedPanel">
  <h2>Saved setups</h2>
  <input id="setupSearch" type="search" placeholder="Search by name…" autocomplete="off">
  <div id="savedList"></div>
</div>

<div id="toast"></div>

<script>
(function(){
  var corners = ["lf","rf","lr","rr"];
  var el = function(id){ return document.getElementById(id); };

  /* ---------- storage adapter: localStorage -> window.storage -> memory ---------- */
  var mem = null;
  var mode = "memory";
  try { localStorage.setItem("__cwtest","1"); localStorage.removeItem("__cwtest"); mode = "local"; }
  catch(e){ if (window.storage) { mode = "claude"; } }
  if (mode === "memory") { el("storageWarn").style.display = "block"; }

  function getSetups(cb){
    if (mode === "local") {
      try { cb(JSON.parse(localStorage.getItem("cw_setups") || "[]")); }
      catch(e){ cb([]); }
    } else if (mode === "claude") {
      window.storage.get("cw_setups").then(function(r){
        cb(r && r.value ? JSON.parse(r.value) : []);
      }).catch(function(){ cb([]); });
    } else {
      cb(mem ? JSON.parse(mem) : []);
    }
  }
  function putSetups(arr, cb){
    var s = JSON.stringify(arr);
    if (mode === "local") { try { localStorage.setItem("cw_setups", s); } catch(e){} cb && cb(); }
    else if (mode === "claude") { window.storage.set("cw_setups", s).then(function(){ cb && cb(); }).catch(function(){ cb && cb(); }); }
    else { mem = s; cb && cb(); }
  }

  /* ---------- corner pair selection ---------- */
  var pair = ["rf", "lr"];
  function isDiagPair(p){
    var s = p.slice().sort().join();
    return s === "lf,rr" || s === "lr,rf";
  }
  function isAxlePair(p){
    var s = p.slice().sort().join();
    return s === "lf,rf" || s === "lr,rr";
  }
  function pairText(p){
    var t = p.map(function(c){ return c.toUpperCase(); }).join(" + ");
    return isDiagPair(p) ? t + " · Cross" : t;
  }

  /* ---------- maths ---------- */
  function val(id){
    var v = parseFloat(el(id).value.replace(",", "."));
    return isNaN(v) || v < 0 ? null : v;
  }
  function fmt(n, dp){ return n.toLocaleString("en-GB", {minimumFractionDigits:dp, maximumFractionDigits:dp}); }

  function recalc(){
    var w = {}, complete = true;
    corners.forEach(function(c){ w[c] = val(c); if (w[c] === null) complete = false; });
    var badge = el("crossBadge");

    if (!complete) {
      corners.forEach(function(c){ el(c+"Pct").textContent = "—"; });
      el("pairLabel").textContent = pairText(pair);
      el("crossVal").textContent = "—";
      el("pairKg").textContent = "—";
      el("totalVal").innerHTML = "— <small>kg</small>";
      el("frVals").textContent = "—";
      el("lrVals").textContent = "—";
      el("diag1").textContent = "—";
      el("diag2").textContent = "—";
      el("frBar").style.width = "50%";
      el("lrBar").style.width = "50%";
      ["Lf","Rf","Lr","Rr"].forEach(function(k){
        el("bal"+k).textContent = "—";
        el("bal"+k).className = "b-d num";
        el("tgt"+k).textContent = "";
      });
      el("balNote").textContent = "Enter all four corners to see balance advice.";
      el("balNote").className = "b-note";
      badge.className = "cross-badge";
      return;
    }

    var total = w.lf + w.rf + w.lr + w.rr;
    if (total <= 0) return;

    var front = w.lf + w.rf, rear = w.lr + w.rr;
    var left = w.lf + w.lr, right = w.rf + w.rr;
    var cross = w.rf + w.lr, otherDiag = w.lf + w.rr;
    var crossPct = 100 * cross / total;

    corners.forEach(function(c){
      el(c+"Pct").textContent = fmt(100*w[c]/total,1) + "%";
    });

    el("totalVal").innerHTML = fmt(total,1) + " <small>kg</small>";
    el("crossVal").textContent = fmt(crossPct,1) + "%";
    el("frVals").textContent = fmt(100*front/total,1) + "% / " + fmt(100*rear/total,1) + "%";
    el("lrVals").textContent = fmt(100*left/total,1) + "% / " + fmt(100*right/total,1) + "%";
    el("frBar").style.width = (100*front/total) + "%";
    el("lrBar").style.width = (100*left/total) + "%";
    el("diag1").textContent = fmt(cross,1) + " kg";
    el("diag2").textContent = fmt(otherDiag,1) + " kg";

    /* Level 1 balance: targets are fully determined by total, F/R split, L/R split
       and a 50% cross target — spring perches can only move weight around the diagonals. */
    var rfT = (total/2 - left + front) / 2;
    var tgt = { rf: rfT, lf: front - rfT, lr: (total/2 + left - front) / 2 };
    tgt.rr = total - front - tgt.lr;
    var tol = 0.5, allOk = true;
    corners.forEach(function(c){
      var d = tgt[c] - w[c];
      var key = c.charAt(0).toUpperCase() + c.slice(1);
      var ok = Math.abs(d) <= tol;
      if (!ok) allOk = false;
      el("bal"+key).textContent = (d >= 0 ? "+" : "\u2212") + fmt(Math.abs(d),2) + " kg";
      el("bal"+key).className = "b-d num" + (ok ? " ok" : "");
      el("tgt"+key).textContent = "target " + fmt(tgt[c],1);
    });
    var note = el("balNote");
    if (allOk) {
      note.textContent = "Balanced \u2014 every corner within " + tol + " kg of target.";
      note.className = "b-note good";
    } else {
      note.className = "b-note";
      note.textContent = (cross < total/2)
        ? "Raise the RF & LR spring perches (or lower LF & RR). Adjust a little, settle the car, re-read the scales."
        : "Raise the LF & RR spring perches (or lower RF & LR). Adjust a little, settle the car, re-read the scales.";
    }
    var grid = document.querySelector(".b-grid");
    if (isAxlePair(pair)) {
      grid.style.display = "none";
      note.className = "b-note";
      note.textContent = "Balance advice is off while the front or rear pair is selected.";
    } else {
      grid.style.display = "";
    }

    if (pair.length < 2) {
      el("pairLabel").textContent = pair[0].toUpperCase() + " \u00B7 tap a 2nd corner";
      el("crossVal").textContent = fmt(100 * w[pair[0]] / total,1) + "%";
      el("pairKg").textContent = fmt(w[pair[0]],1) + " kg";
      badge.className = "cross-badge";
      return;
    }
    var pairSum = w[pair[0]] + w[pair[1]];
    var pairPct = 100 * pairSum / total;
    el("pairLabel").textContent = pairText(pair);
    el("crossVal").textContent = fmt(pairPct,1) + "%";
    el("pairKg").textContent = fmt(pairSum,1) + " kg";
    if (isDiagPair(pair)) {
      var dev = Math.abs(pairPct - 50);
      badge.className = "cross-badge " + (dev <= 0.5 ? "good" : (dev >= 2 ? "bad" : ""));
    } else {
      badge.className = "cross-badge";
    }
  }
  corners.forEach(function(c){ el(c).addEventListener("input", recalc); });

  /* Cursor always lands at the right-hand end of the number on tap/focus */
  corners.forEach(function(c){
    var f = el(c);
    function toEnd(){
      requestAnimationFrame(function(){
        var n = f.value.length;
        try { f.setSelectionRange(n, n); } catch(e){}
      });
    }
    f.addEventListener("focus", toEnd);
    f.addEventListener("click", toEnd);
  });

  function refreshSel(){
    document.querySelectorAll(".corner").forEach(function(card){
      card.classList.toggle("sel", pair.indexOf(card.dataset.c) !== -1);
    });
  }
  document.querySelectorAll(".corner").forEach(function(card){
    card.addEventListener("click", function(e){
      if (e.target.tagName === "INPUT") return;
      var c = card.dataset.c;
      var i = pair.indexOf(c);
      if (i !== -1) {
        if (pair.length > 1) pair.splice(i, 1);
      } else {
        pair.push(c);
        if (pair.length > 2) pair.shift();
      }
      refreshSel();
      recalc();
    });
  });
  refreshSel();

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg){
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  /* ---------- save / load ---------- */
  el("saveBtn").addEventListener("click", function(){
    var complete = corners.every(function(c){ return val(c) !== null; });
    if (!complete) { toast("Enter all four corners first"); return; }
    var name = el("jobName").value.trim() || "Setup " + new Date().toLocaleDateString("en-GB");
    getSetups(function(list){
      list = list.filter(function(s){ return s.name !== name; });
      list.unshift({
        name: name,
        ts: Date.now(),
        date: new Date().toLocaleString("en-GB", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}),
        lf: val("lf"), rf: val("rf"), lr: val("lr"), rr: val("rr")
      });
      putSetups(list, function(){
        el("jobName").value = name;
        toast("Saved \u201C" + name + "\u201D");
        renderList(list);
      });
    });
  });

  el("loadBtn").addEventListener("click", function(){
    var p = el("savedPanel");
    if (p.classList.contains("open")) { p.classList.remove("open"); return; }
    getSetups(function(list){
      renderList(list);
      p.classList.add("open");
      setTimeout(function(){ p.scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
    });
  });

  el("clearBtn").addEventListener("click", function(){
    corners.forEach(function(c){ el(c).value = ""; });
    el("jobName").value = "";
    recalc();
  });

  var currentList = [];
  el("setupSearch").addEventListener("input", function(){ renderList(); });

  function renderList(list){
    if (list) currentList = list;
    var box = el("savedList");
    box.innerHTML = "";
    var q = el("setupSearch").value.trim().toLowerCase();
    var shown = currentList.slice()
      .sort(function(a,b){ return (b.ts||0) - (a.ts||0); })
      .filter(function(s){ return !q || s.name.toLowerCase().indexOf(q) !== -1; });
    if (!shown.length) {
      box.innerHTML = "<div class='empty'>" + (q ? "No setups match your search." : "No saved setups yet. Enter weights and tap Save.") + "</div>";
      return;
    }
    shown.forEach(function(s, i){
      var row = document.createElement("div");
      row.className = "setup-item";
      var info = document.createElement("div");
      info.className = "info";
      info.innerHTML = "<div class='name'></div><div class='meta num'></div>";
      info.querySelector(".name").textContent = s.name;
      info.querySelector(".meta").textContent = s.date + " · " + fmt(s.lf+s.rf+s.lr+s.rr,1) + " kg";
      var loadB = document.createElement("button");
      loadB.textContent = "Load";
      loadB.addEventListener("click", function(){
        el("lf").value = s.lf; el("rf").value = s.rf; el("lr").value = s.lr; el("rr").value = s.rr;
        el("jobName").value = s.name;
        recalc();
        el("savedPanel").classList.remove("open");
        toast("Loaded \u201C" + s.name + "\u201D");
      });
      var delB = document.createElement("button");
      delB.className = "danger";
      delB.textContent = "Delete";
      delB.addEventListener("click", function(){
        if (!confirm("Delete \u201C" + s.name + "\u201D?")) return;
        getSetups(function(list2){
          list2.splice(list2.findIndex(function(x){ return x.name === s.name; }), 1);
          putSetups(list2, function(){ renderList(list2); toast("Deleted"); });
        });
      });
      row.appendChild(info); row.appendChild(loadB); row.appendChild(delB);
      box.appendChild(row);
    });
  }

  recalc();
})();
</script>
<script>
/* Home-screen install: offline support and keep saved setups */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
</script>
